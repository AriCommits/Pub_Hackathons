output_dir: results/adapters/b1
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
max_seq_len: 2048
learning_rate: 2.0e-4
num_train_epochs: 2
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
load_in_4bit: true
logging_steps: 10
save_steps: 100
