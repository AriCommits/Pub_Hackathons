# ActProto-LoRA trial layout — edit paths and run knobs here, then:
#   python scripts/run_trial.py --run B0|B1|B2|all
#   python scripts/compare_results.py
#
# Model weights / activation hooks still come from default.yaml + model.yaml (+ optional layer.yaml).

paths:
  data_processed: data/processed
  activations_dump: results/activations
  adapter_b1: results/adapters/b1
  results_root: results
  prototypes_dir: results
  reports_dir: results/b0_b2

eval:
  split: test
  limit: null

hypothesis:
  correctness_drop_pp: 3.0
  latency_ratio: 1.5
  min_coverage: 0.5

prototype_fit:
  min_coverage: 0.5

runs:
  B0:
    description: Base Tiny Aya, no adapter, no router
    adapter: null
    router: false
  B1:
    description: Ordinary LoRA, no router
    adapter: results/adapters/b1
    router: false
  B2:
    description: LoRA + prototype router
    adapter: results/adapters/b1
    router: true
    prototypes: results/prototypes.npz
    threshold: results/prototype_metrics.json
  B2d1:
    description: LoRA + prototype router, depth-1 episode
    adapter: results/adapters/b1
    router: true
    prototypes: results/prototypes.npz
    threshold: results/prototype_metrics.json
    max_agent_steps: 2
    replicas: 1
    route_first_hop_only: true
  B2d1r:
    description: depth-1 retry after the one-call stop
    adapter: results/adapters/b1
    router: true
    prototypes: results/prototypes.npz
    threshold: results/prototype_metrics.json
    route_first_hop_only: true
    max_agent_steps: 2
    replicas: 1
  B2d1log:
    description: argument log of the depth-1 retry
    adapter: results/adapters/b1
    router: true
    prototypes: results/prototypes.npz
    threshold: results/prototype_metrics.json
    route_first_hop_only: true
    max_agent_steps: 2
    replicas: 1
  B2d1a:
    description: depth-1 retry with the assistant-only adapter
    adapter: results/adapters/b1_assistant_only
    router: true
    prototypes: results/prototypes.npz
    threshold: results/prototype_metrics.json
    route_first_hop_only: true
    max_agent_steps: 2
    replicas: 1
  B2d1ap:
    description: depth-1 retry with the assistant-only adapter and its own prototypes
    adapter: results/adapters/b1_assistant_only
    router: true
    prototypes: results/prototypes_b1a.npz
    threshold: results/prototype_metrics_b1a.json
    route_first_hop_only: true
    max_agent_steps: 2
    replicas: 1
  B2apchain:
    description: assistant-only adapter and its prototypes, model chains after the first hop
    adapter: results/adapters/b1_assistant_only
    router: true
    prototypes: results/prototypes_b1a.npz
    threshold: results/prototype_metrics_b1a.json
    route_first_hop_only: true
    max_agent_steps: 4
    replicas: 1
  B2combo:
    description: scripted tool combinations, including one 12-call sequence, on the paired adapter
    adapter: results/adapters/b1_assistant_only
    router: true
    prototypes: results/prototypes_b1a.npz
    threshold: results/prototype_metrics_b1a.json
    route_first_hop_only: true
    max_agent_steps: 12
    replicas: 1
  B2orders:
    description: original test on the order-curriculum adapter and its prototypes
    adapter: results/adapters/b1_orders
    router: true
    prototypes: results/prototypes_b1_orders.npz
    threshold: results/prototype_metrics_b1_orders.json
    route_first_hop_only: true
    max_agent_steps: 4
    replicas: 1
  B2ordereval:
    description: "diagnostic_train_echo: one copy of each curriculum order (overlaps training prompts)"
    adapter: results/adapters/b1_orders
    router: true
    prototypes: results/prototypes_b1_orders.npz
    threshold: results/prototype_metrics_b1_orders.json
    route_first_hop_only: true
    max_agent_steps: 12
    replicas: 1
  B2fmt:
    description: original test on the multi-format order adapter and its prototypes
    adapter: results/adapters/b1_formats
    router: true
    prototypes: results/prototypes_b1_formats.npz
    threshold: results/prototype_metrics_b1_formats.json
    route_first_hop_only: true
    max_agent_steps: 4
    replicas: 1
  B2fmteval:
    description: "diagnostic_train_echo: one copy of every prompt format (overlaps training prompts)"
    adapter: results/adapters/b1_formats
    router: true
    prototypes: results/prototypes_b1_formats.npz
    threshold: results/prototype_metrics_b1_formats.json
    route_first_hop_only: true
    max_agent_steps: 12
    replicas: 1
  B2chain:
    description: route every hop from the transcript, including the tool call and the tool result
    adapter: results/adapters/b1
    router: true
    prototypes: results/prototypes.npz
    threshold: results/prototype_metrics.json
    route_first_hop_only: false
    max_agent_steps: 4
    replicas: 1

export:
  # Frozen SFT baseline (see docs/SFT_BASELINE_MANIFEST.json). Also mirrored at results/adapters/e2.
  # Historical b1 stays under paths.adapter_b1.
  adapter: results/sft_v2/e2/checkpoint-150
  data: data/processed
  logs: results/b0_b2
